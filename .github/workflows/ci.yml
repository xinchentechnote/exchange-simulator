name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAR: target/exchange-simulator-1.0-SNAPSHOT.jar

jobs:
  build-test:
    name: 构建+单元测试 (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8 = 生产运行时（chronicle 依赖仅兼容 JDK 8）
        # 17 = 兼容性哨兵：单测/编译在新 JDK 上不回归（运行时冒烟仅在 JDK 8）
        java: [ '8', '17' ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: 编译 + 单元测试 + 打包
        run: mvn -B -ntp clean verify

      - name: 上传构建产物（仅 JDK 8）
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: exchange-simulator-jar
          path: ${{ env.JAR }}
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: 打包产物冒烟 (JDK 8)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: 检出代码（需要 data/ 与测试脚本）
        uses: actions/checkout@v4

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: exchange-simulator-jar
          path: target/

      - name: 启动冒烟（复用 local-test.sh boot 阶段）
        run: JAVA8_HOME="$JAVA_HOME" ./local-test.sh boot

  protocol-e2e:
    name: SSE 协议端到端回归 (gt-auto)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: 检出代码（需要 testcase/ 与测试脚本）
        uses: actions/checkout@v4

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: exchange-simulator-jar
          path: target/

      - name: 安装 gt-auto
        run: |
          go install github.com/xinchentechnote/gt-auto/cmd/gt-auto@v0.2.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 协议回归（复用 local-test.sh e2e 阶段）
        run: JAVA8_HOME="$JAVA_HOME" ./local-test.sh e2e
