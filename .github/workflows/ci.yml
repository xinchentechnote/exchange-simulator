name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAR: target/exchange-simulator-1.0-SNAPSHOT.jar

jobs:
  # codec/sse-bin/szse-bin 只存在于 fin-proto-java 的 Gradle 构建产物中，未发布到 Maven Central，
  # CI 必须现场构建后喂给后续 Maven 步骤（本地开发者由 ~/.m2 里的 publishToMavenLocal 产物提供）。
  finproto-deps:
    name: 构建协议依赖 (fin-proto-java)
    runs-on: ubuntu-latest
    steps:
      - name: 检出 fin-proto-java
        uses: actions/checkout@v4
        with:
          repository: xinchentechnote/fin-proto-java
          # 协议变更需要跟版时，把 main 换成对应 tag/commit
          ref: main

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          # fin-proto-java 的 Gradle 工具链固定 languageVersion=11（产物字节码仍是 Java 8）
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 发布 codec/sse-bin/szse-bin
        run: |
          ./gradlew --no-daemon -Dmaven.repo.local="$RUNNER_TEMP/m2" \
            :codec:publishToMavenLocal \
            :sse-bin:publishToMavenLocal \
            :szse-bin:publishToMavenLocal

      - name: 上传协议依赖
        uses: actions/upload-artifact@v4
        with:
          name: finproto-m2
          path: ${{ runner.temp }}/m2
          if-no-files-found: error
          retention-days: 7

  build-test:
    name: 构建+单元测试 (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: finproto-deps
    strategy:
      fail-fast: false
      matrix:
        # 8 = 生产运行时（chronicle 依赖仅兼容 JDK 8）
        # 17 = 兼容性哨兵：单测/编译在新 JDK 上不回归（运行时冒烟仅在 JDK 8）
        java: [ '8', '17' ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: 下载协议依赖
        uses: actions/download-artifact@v4
        with:
          name: finproto-m2
          path: ${{ runner.temp }}/finproto-m2

      - name: 安装协议依赖到本地 Maven 仓库
        run: |
          mkdir -p "$HOME/.m2/repository"
          cp -R "$RUNNER_TEMP/finproto-m2/." "$HOME/.m2/repository/"

      - name: 编译 + 单元测试 + 打包
        run: mvn -B -ntp clean verify

      - name: 上传构建产物（仅 JDK 8）
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: exchange-simulator-jar
          path: ${{ env.JAR }}
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: 打包产物冒烟 (JDK 8)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: 检出代码（需要 data/ 与测试脚本）
        uses: actions/checkout@v4

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: exchange-simulator-jar
          path: target/

      - name: 启动冒烟（复用 local-test.sh boot 阶段）
        run: JAVA8_HOME="$JAVA_HOME" ./local-test.sh boot

  protocol-e2e:
    name: 协议端到端回归 (gt-auto SSE+SZSE)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: 检出代码（需要 testcase/ 与测试脚本）
        uses: actions/checkout@v4

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: exchange-simulator-jar
          path: target/

      - name: 安装 gt-auto
        run: |
          # v0.2.1 起 SZSE 期望消息预填 ExecutionReport.ApplExtend（成交回报全字段校验依赖此修复）
          go install github.com/xinchentechnote/gt-auto/cmd/gt-auto@v0.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 协议回归（复用 local-test.sh e2e 阶段）
        run: JAVA8_HOME="$JAVA_HOME" ./local-test.sh e2e
